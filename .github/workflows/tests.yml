# Fast test suites on push and pull request. No secrets, no deploy.
# Deploy of services/camdetect -> Cloud Run swiftbackend stays on Cloud Build trigger
# 76bbca35 (see services/camdetect/README.md). Deploy of services/forecastapi -> Cloud Run
# forecast-api stays on Cloud Build (services/forecastapi/cloudbuild.yaml, branch ^main$
# only). Deploy of services/gmapfetcher -> Cloud Run gmap-woodlands-fetcher stays on
# Cloud Build trigger 33e4b77e. This workflow has no deploy credentials. Slow TensorFlow tests:
# job pytest-slow (manual or weekly), or locally with scripts/run_tests.ps1 -Slow
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0"  # Mondays 04:00 SGT: slow TensorFlow suite

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [camdetect, weather, eval, forecastapi, repo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          case "${{ matrix.suite }}" in
            camdetect)   pip install -r services/camdetect/requirements-dev.txt ;;
            weather)     pip install -r data/weather/requirements-dev.txt ;;
            eval)        pip install -r eval/requirements-dev.txt ;;
            forecastapi) pip install -r services/forecastapi/requirements-dev.txt ;;
            repo)        pip install -r scripts/requirements-dev.txt ;;
          esac
      - name: Test (fast; slow marker excluded by pytest.ini)
        run: bash scripts/run_tests.sh "${{ matrix.suite }}"

  gmapfetcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test gmapfetcher
        run: npm test
        working-directory: services/gmapfetcher

  # TensorFlow tests (deep models, Transformer, seeds). Manual or weekly; not a PR gate, because the
  # TensorFlow install is large. Pinned by eval/requirements-notebook.txt.
  pytest-slow:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r eval/requirements-notebook.txt
      - name: Test eval including slow
        run: bash scripts/run_tests.sh --slow eval
