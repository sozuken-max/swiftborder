# CI/CD for Cloud Run service swiftbackend (camdetect): test, docker build + push, deploy. Not forecast-api.
# Trigger 76bbca35 runs this on a push to ^main$ once its configuration points at this file
# (until then the trigger's inline config still runs). No keys: the Roboflow key and other env vars
# stay on the service, and `services update --image` leaves them untouched.
# The image comes from camdetect/Dockerfile, on the same python:3.11-slim the Test step pulls, so the
# build reuses that download. Buildpacks were dropped: build d949348e spent most of a minute pulling
# builder google-22 and its lifecycle image (cold on the build machine) for about 8 s of real work.
# python:3.11-slim (here and in the Dockerfile) resolved 2026-10-08 from mirror.gcr.io; cloud-sdk:slim
# is the digest forecastapi/cloudbuild.yaml uses (2026-10-03). Refresh the digests deliberately.

steps:
  - id: Test
    # mirror.gcr.io is Google's Docker Hub mirror; -slim is a fraction of the full python image.
    name: mirror.gcr.io/library/python:3.11-slim@sha256:0dd364ba7e10242f07755449e3a3d0e35f9efd987952737b90def6709ab0c5ce
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install -q --disable-pip-version-check --root-user-action=ignore -r camdetect/requirements-dev.txt
        cd camdetect && python -m pytest -q -p no:cacheprovider

  - id: Build
    # Not pinned by digest on purpose: Cloud Build machines already hold the current docker builder
    # ("Already have image"), and a pinned older digest would be downloaded on every build.
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - camdetect

  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA

  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:7c2dbc4eeba1e500b788be19cae33599cefe3294949a62c034bd1c2002329f69
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - $_SERVICE_NAME
      - --project=$_AR_PROJECT_ID
      - --region=$_DEPLOY_REGION
      - --platform=managed
      - --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      # --update-labels adds or overwrites these keys and keeps any other label on the service.
      - --update-labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID
      - --quiet

substitutions:
  _AR_HOSTNAME: europe-west1-docker.pkg.dev
  _AR_PROJECT_ID: swiftborder
  _AR_REPOSITORY: cloud-run-source-deploy
  _DEPLOY_REGION: europe-west1
  _FUNCTION_TARGET: detect
  _SERVICE_NAME: swiftbackend

options:
  logging: CLOUD_LOGGING_ONLY
  # The trigger may still define substitutions this file does not use.
  substitutionOption: ALLOW_LOOSE

timeout: 1200s

tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
  - swiftbackend
