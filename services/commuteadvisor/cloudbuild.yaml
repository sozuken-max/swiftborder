# CI/CD for Cloud Run service commute-advisor: test, build, deploy as a no-traffic candidate, smoke-test
# the candidate, then move traffic. A separate service: it never deploys or changes forecast-api.
# Trigger (create once, docs/runbooks/commute-advisor.md): push to ^main$ touching services/commuteadvisor/**.
# The OpenAI key comes from Secret Manager secret openai-api-key; it is never in this file or the image.
# Images are pinned by the same digests as services/forecastapi/cloudbuild.yaml.
# In bash below, $$ escapes a shell variable from Cloud Build substitution.

steps:
  - id: Test
    name: python:3.11@sha256:50ffeeb3884b139e654d2ce95300cf67d016febfb93d54ecf68a00d723fa6fc6
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install -q -r services/commuteadvisor/requirements-dev.txt
        cd services/commuteadvisor && python -m pytest -q

  - id: Buildpack
    name: gcr.io/k8s-skaffold/pack@sha256:221c0c0d9a90f46f108bb888a1da9e99c82ff631e8b1c63b0223ea951752bd53
    entrypoint: pack
    args:
      - build
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - --builder=gcr.io/buildpacks/builder:google-22@sha256:8201b9de682ba74cd5552128b81940e233d3afaec27412d14dd8a8d2dc572368
      - --network=cloudbuild
      - --publish
      - --path=services/commuteadvisor
      - --env=GOOGLE_FUNCTION_TARGET
      - --env=GOOGLE_PYTHON_VERSION
    env:
      - GOOGLE_FUNCTION_TARGET=$_FUNCTION_TARGET
      - GOOGLE_PYTHON_VERSION=3.11.x

  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:7c2dbc4eeba1e500b788be19cae33599cefe3294949a62c034bd1c2002329f69
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        args=(
          --project=$_AR_PROJECT_ID --region=$_DEPLOY_REGION --platform=managed
          --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
          --min-instances=0 --max-instances=$_MAX_INSTANCES --memory=512Mi --cpu=1 --timeout=300
          --service-account=$_RUNTIME_SERVICE_ACCOUNT
          # Public like forecast-api: the Firebase page calls it from the browser. It takes no input and
          # caches one answer per forecast origin, so a caller cannot run up the OpenAI bill.
          --no-invoker-iam-check
          --set-secrets=OPENAI_API_KEY=$_OPENAI_SECRET:latest
          --set-env-vars=OPENAI_MODEL=$_OPENAI_MODEL,COMMIT_SHA=$COMMIT_SHA
          --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID
          --quiet
        )
        if gcloud run services describe $_SERVICE_NAME --project=$_AR_PROJECT_ID --region=$_DEPLOY_REGION >/dev/null 2>&1; then
          gcloud run deploy $_SERVICE_NAME "$${args[@]}" --no-traffic --tag=candidate
          echo existing > /workspace/deploy_mode
        else
          gcloud run deploy $_SERVICE_NAME "$${args[@]}"
          echo new > /workspace/deploy_mode
        fi

  - id: Smoke
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:7c2dbc4eeba1e500b788be19cae33599cefe3294949a62c034bd1c2002329f69
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        mode=$$(cat /workspace/deploy_mode)
        gcloud run services describe $_SERVICE_NAME --project=$_AR_PROJECT_ID --region=$_DEPLOY_REGION --format=json > /workspace/service.json
        url=$$(python3 - "$$mode" <<'PY'
        import json, sys
        svc = json.load(open("/workspace/service.json"))
        if sys.argv[1] == "existing":
            print(next(t["url"] for t in svc["status"]["traffic"] if t.get("tag") == "candidate"))
        else:
            print(svc["status"]["url"])
        PY
        )
        echo "smoke target: $$url"
        origin="https://swiftborder-92b45.web.app"
        # forecast-api may be cold (about 90 s): allow four minutes
        code=$$(curl -s -D /workspace/h -o /workspace/advice.json -w '%{http_code}' --max-time 240 -H "Origin: $$origin" "$$url/")
        cat /workspace/advice.json; echo
        grep -qi '^access-control-allow-origin:' /workspace/h || { echo "no CORS header"; exit 1; }
        case "$$code" in
          200)
            grep -q '"facts"' /workspace/advice.json
            # the secret must reach the container; an OpenAI outage alone does not block a deploy
            if grep -q 'OPENAI_API_KEY' /workspace/advice.json; then echo "OPENAI_API_KEY missing in the container"; exit 1; fi ;;
          503) echo "forecast-api had no forecast; the service answered correctly" ;;
          *) echo "advice returned $$code"; exit 1 ;;
        esac
        code=$$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST "$$url/")
        test "$$code" = "405" || { echo "POST returned $$code, expected 405"; exit 1; }

  - id: Promote
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:7c2dbc4eeba1e500b788be19cae33599cefe3294949a62c034bd1c2002329f69
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "$$(cat /workspace/deploy_mode)" = "existing" ]; then
          gcloud run services update-traffic $_SERVICE_NAME --project=$_AR_PROJECT_ID --region=$_DEPLOY_REGION --to-latest --quiet
          gcloud run services update-traffic $_SERVICE_NAME --project=$_AR_PROJECT_ID --region=$_DEPLOY_REGION --remove-tags=candidate --quiet
        fi

substitutions:
  _AR_HOSTNAME: asia-southeast1-docker.pkg.dev
  _AR_PROJECT_ID: swiftborder
  _AR_REPOSITORY: cloud-run-source-deploy
  _DEPLOY_REGION: asia-southeast1
  _FUNCTION_TARGET: commute_advice
  _SERVICE_NAME: commute-advisor
  # shared with forecast-api (decision 2026-11-13); it needs secretAccessor on openai-api-key
  _RUNTIME_SERVICE_ACCOUNT: forecast-api@swiftborder.iam.gserviceaccount.com
  _OPENAI_SECRET: openai-api-key
  _OPENAI_MODEL: gpt-4o-mini
  _MAX_INSTANCES: "2"

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE

timeout: 1200s

tags:
  - commute-advisor
